<!-- Roxy panel -->

<script src="chrome://roxy/content/preferences.js"/>
<html:template id="template-paneRoxy">

<hbox id="roxyCategory"
      class="subcategory"
      hidden="true"
      data-category="paneRoxy">
  <html:h1>RoxyScript</html:h1>
</hbox>

<!--
  本体の再設計後のペインと同じ構造にする（setting-group が描画するのと同じ
  moz-card > moz-fieldset > moz-checkbox の入れ子）。
  見た目を自前で作ると本体の更新のたびにずれるが、同じ部品なら追従する。
  label / description は Fluent を介さず素の属性で渡せる。
-->

<html:moz-card id="roxyUserScriptGroup"
               role="presentation"
               data-category="paneRoxy"
               hidden="true">
  <html:moz-fieldset iconsrc="chrome://global/skin/icons/highlights.svg"
                     label="スクリプトの実行">
    <html:moz-checkbox id="roxyScriptEnabled"
                       preference="roxy.script.enabled"
                       label="RoxyScript を有効にする"
                       description="再起動後に反映されます"/>

    <html:moz-checkbox id="roxyUpdateEnabled"
                       preference="roxy.script.update.enabled"
                       label="スクリプトを自動更新する"
                       description="新しい版が出たら自動で置き換えます。配布元を信頼することになります。"/>

    <html:moz-box-button id="roxyOpenManager"
                         label="スクリプトを管理"
                         description="追加・編集・削除と、実行時エラーの確認"/>
  </html:moz-fieldset>
</html:moz-card>

<html:moz-card id="roxyScriptSecurityGroup"
               role="presentation"
               data-category="paneRoxy"
               hidden="true">
  <html:moz-fieldset iconsrc="chrome://global/skin/icons/security.svg"
                     label="スクリプトの通信">
    <html:moz-checkbox id="roxyEnforceConnect"
                       preference="roxy.script.gmxhr.enforce_connect"
                       label="接続先を @connect の宣言に限定する"
                       description="無効にすると、スクリプトが任意のサイトへ Cookie 付きで通信できます。理由がなければ有効のままにしてください。"/>
  </html:moz-fieldset>
</html:moz-card>

</html:template>
